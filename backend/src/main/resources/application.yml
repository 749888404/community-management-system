server:
  port: 8080
  servlet:
    context-path: /

# 自定义配置
community:
  upload-dir: ./uploads

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1024MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地默认连 localhost；云端部署（Render 等）通过环境变量注入：
    #   DB_URL / DB_USERNAME / DB_PASSWORD
    url: ${DB_URL:jdbc:mysql://localhost:3306/community_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    # 连接池空闲回收：Railway 的 Serverless 判定「连续 5 分钟无出站流量」才休眠，
    # 若连接池常驻长连接会被视为活跃。minimum-idle 置 0 + 60 秒空闲回收，
    # 让无访问时段连接全部释放，容器才能真正休眠（省 Free 档每月 $1 额度）。
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000
      keepalive-time: 0
      connection-timeout: 20000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/*.xml
